<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Lokasi – QR</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: light dark; --primary:#0d6efd; --bg:#fff; --border:#ddd; }
    @media (prefers-color-scheme: dark){ :root{ --primary:#3d8bfd; --bg:#1e1e1e; --border:#333; } body{ background:#121212; color:#e6e6e6; } }
    body{ font-family:system-ui,-apple-system,sans-serif; margin:24px; line-height:1.5; }
    .card{ max-width:560px; margin:auto; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:20px; }
    h1{ margin:0 0 8px; font-size:20px; color:var(--primary); }
    .muted{ color:#888; font-size:13px; }
    input, textarea{ width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid var(--border); background:inherit; color:inherit; }
    .btn{ display:block; text-align:center; padding:12px; border-radius:8px; background:var(--primary); color:#fff; text-decoration:none; font-weight:600; }
    .btn.disabled{ background:#999; pointer-events:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧭 Audit Lokasi (QR)</h1>
    <p id="tzInfo" class="muted">Memuat WIB…</p>

    <label>Lokasi</label>
    <input id="locDisp" type="text" readonly>

    <label>Pertanyaan Hari Ini</label>
    <input id="questionDisp" type="text" readonly>

    <div id="warn" class="muted" style="margin:8px 0 6px;"></div>

    <label>Jawaban</label>
    <div style="display:flex; gap:8px;">
      <label style="display:flex; align-items:center; gap:6px;"><input id="optYa" type="radio" name="ans" value="Ya"> Ya</label>
      <label style="display:flex; align-items:center; gap:6px;"><input id="optTidak" type="radio" name="ans" value="Tidak"> Tidak</label>
    </div>

    <label>Catatan</label>
    <textarea id="note" rows="3" placeholder="Tambahkan catatan jika perlu"></textarea>

    <a id="btnMail" class="btn" href="#">Kirim ke Admin</a>
    <p class="muted" style="margin-top:8px;">💡 Lampirkan <b>foto bukti</b> dari aplikasi email. Geo-tag tidak wajib.</p>
  </div>

<script>
(function(){
  let ADMIN_EMAIL = "suprapto@nekaboga.com"; // fallback, dioverride dari JSON
  const JSON_URLS = [ './data/questions.json', 'data/questions.json', './questions.json', 'questions.json' ];
  const CRLF = "\r\n";

  function getParam(name, def="") { const v = new URLSearchParams(location.search).get(name); return (v === null ? def : v); }
  function getWIBDateObj(){ const now=new Date(); return new Date(now.getTime() + (now.getTimezoneOffset()*60000) + (7*3600000)); }
  function getWIBDateISO(){ return getWIBDateObj().toISOString().split('T')[0]; }
  function getWIBDayInfo(){ const d=getWIBDateObj(); const dow=d.getUTCDay(); const names=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']; return {dow, name:names[dow]}; }
  function isWorkdayWIB(){ const {dow}=getWIBDayInfo(); return dow>=1 && dow<=5; }

  function seededRandom(seed){ let t = seed + 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  function hashStr(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++) h=Math.imul(h^str.charCodeAt(i),16777619); return h>>>0; }

  async function loadData(){ let lastErr=null; for(const u of JSON_URLS){ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status+' '+r.statusText+' @ '+u); const j=await r.json(); return j; }catch(e){ lastErr=e; } } throw lastErr||new Error('Unknown error'); }

  function toSlug(s){ return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function composeMailto(to, subject, body){ return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }
  function setReadonly(disabled){ const radios=[document.getElementById('optYa'),document.getElementById('optTidak')]; radios.forEach(r=>{ if(r) r.disabled=disabled; }); const note=document.getElementById('note'); if(note) note.readOnly=disabled; const btn=document.getElementById('btnMail'); if(btn){ if(disabled){ btn.classList.add('disabled'); btn.removeAttribute('href'); }else{ btn.classList.remove('disabled'); } } }

  function render(){
    const tanggal = getWIBDateISO();
    const day = getWIBDayInfo();
    const workday = isWorkdayWIB();

    document.getElementById('tzInfo').textContent = `WIB (UTC+7) — ${day.name} — ${tanggal}`;

    const locToken = getParam('loc','UMUM');

    loadData().then(data=>{
      if (data.adminEmail) ADMIN_EMAIL = data.adminEmail;

      const found = (data.locations||[]).find(l => l.key===locToken || l.name===locToken || toSlug(l.name||'')===locToken || (l.slug && String(l.slug)===locToken));
      const locName = found ? found.name : locToken;

      let question = '';
      const Q = data.questions || [];
      if (Q.length>0){ const seed = hashStr(tanggal + '|' + locToken); const idx = Math.floor(seededRandom(seed) * Q.length); question = Q[idx]; }

      document.getElementById('locDisp').value = locName;
      document.getElementById('questionDisp').value = question || 'Tidak ada pertanyaan';

      if (!workday){ document.getElementById('warn').innerHTML = '⏳ <b>Readonly:</b> Bukan hari kerja (Sen–Jum WIB).'; setReadonly(true); }
      else { document.getElementById('warn').textContent = ''; setReadonly(false); }

      function updateDraft(){
        const ansEl = document.querySelector('input[name="ans"]:checked');
        const ans = ansEl ? ansEl.value : '';
        const note = document.getElementById('note').value || '';
        const subject = `Audit Lokasi ${tanggal} – ${locName}`;
        const body = [
          `Tanggal: ${tanggal}`,
          `Lokasi: ${locName} (${locToken})`,
          `Pertanyaan: ${question || 'Tidak ada pertanyaan'}`,
          ``,
          `Jawaban: ${ans}`,
          `Catatan: ${note}`,
          ``,
          `---`,
          `Dikirim via QR Audit Harian`
        ].join(CRLF);
        const btn = document.getElementById('btnMail');
        if (btn && !btn.classList.contains('disabled')) btn.href = composeMailto(ADMIN_EMAIL, subject, body);
      }

      updateDraft();
      document.querySelectorAll('input[name="ans"]').forEach(el=> el.addEventListener('change', updateDraft));
      document.getElementById('note').addEventListener('input', updateDraft);
    }).catch(()=>{ /* no preview needed */ });
  }

  render();
})();
</script>
</body>
</html>
